<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100" role="img" aria-label="FidgetSupply.com Logo">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="logoSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="logoAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Emblem Mark (88x88 centered vertically at x=6, y=6) -->
  <g transform="translate(6, 6) scale(0.88)">
    <rect width="100" height="100" rx="22" fill="url(#logoBg)" />
    <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="url(#logoCyan)" stroke-width="2.5" stroke-opacity="0.55" />
    <circle cx="50" cy="50" r="34" fill="none" stroke="#334155" stroke-width="1.75" stroke-dasharray="6 4" />
    <rect x="34" y="26" width="44" height="54" rx="10" fill="#1e293b" stroke="url(#logoCyan)" stroke-width="3" />
    <circle cx="66" cy="37" r="3.2" fill="url(#logoCyan)" />
    <circle cx="66" cy="53" r="3.2" fill="url(#logoCyan)" />
    <circle cx="66" cy="69" r="3.2" fill="url(#logoCyan)" />
    <rect x="22" y="20" width="44" height="54" rx="10" fill="url(#logoBg)" stroke="url(#logoSteel)" stroke-width="3.2" />
    <rect x="31" y="30" width="26" height="8" rx="4" fill="url(#logoCyan)" />
    <rect x="31" y="43" width="18" height="7" rx="3.5" fill="#cbd5e1" />
    <circle cx="35" cy="61" r="4.5" fill="url(#logoAmber)" />
    <circle cx="53" cy="61" r="3.2" fill="#64748b" />
  </g>

  <!-- Brand Wordmark -->
  <text x="112" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.8" fill="#0f172a">
    FIDGET<tspan fill="#0284c7">SUPPLY</tspan>
  </text>

  <!-- Brand Subtitle -->
  <text x="114" y="77" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.2" fill="#64748b">
    METAL EDC &amp; KINETIC TOYS
  </text>
</svg>
