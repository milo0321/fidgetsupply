<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fsSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="fsAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer CNC Chamfered Housing -->
  <rect width="100" height="100" rx="22" fill="url(#fsBg)" />
  <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="url(#fsCyan)" stroke-width="2.5" stroke-opacity="0.55" />

  <!-- Subtle Gyro / Bearing Orbit Ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#334155" stroke-width="1.75" stroke-dasharray="6 4" />

  <!-- Bottom CNC Slider Plate (Offset Right-Down) -->
  <rect x="34" y="26" width="44" height="54" rx="10" fill="#1e293b" stroke="url(#fsCyan)" stroke-width="3" />
  <!-- N52 Magnet Wells on Bottom Plate -->
  <circle cx="66" cy="37" r="3.2" fill="url(#fsCyan)" />
  <circle cx="66" cy="53" r="3.2" fill="url(#fsCyan)" />
  <circle cx="66" cy="69" r="3.2" fill="url(#fsCyan)" />

  <!-- Top CNC Haptic Slider Plate (Offset Left-Up, forming geometric F/S step) -->
  <rect x="22" y="20" width="44" height="54" rx="10" fill="url(#fsBg)" stroke="url(#fsSteel)" stroke-width="3.2" />

  <!-- Precision CNC Fuller Groove / Milling Slot on Top Plate -->
  <rect x="31" y="30" width="26" height="8" rx="4" fill="url(#fsCyan)" />
  <rect x="31" y="43" width="18" height="7" rx="3.5" fill="#cbd5e1" />

  <!-- Haptic Bearing Core & N52 Magnet Accents -->
  <circle cx="35" cy="61" r="4.5" fill="url(#fsAmber)" />
  <circle cx="53" cy="61" r="3.2" fill="#64748b" />
</svg>
